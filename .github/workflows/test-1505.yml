name: Scheduled 15:40 Hotel Test

on:
  schedule:
    - cron: "40 6 10 6 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create voco Scenia Bay hotel test page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          TZ: Asia/Seoul
        run: python src/test_current_news.py
